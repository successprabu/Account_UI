# Builds every pull request so problems are caught before anything reaches the live site.
name: Build check

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Report bundle sizes
        run: |
          echo "### Bundle sizes" >> "$GITHUB_STEP_SUMMARY"
          echo '| File | Size | Gzipped |' >> "$GITHUB_STEP_SUMMARY"
          echo '| --- | --- | --- |' >> "$GITHUB_STEP_SUMMARY"
          for f in $(ls -S build/assets/*.js | head -15); do
            echo "| $(basename "$f") | $(du -h "$f" | cut -f1) | $(gzip -c "$f" | wc -c | numfmt --to=iec) |" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "Entry: $(grep -o 'assets/index[^"]*\.js' build/index.html)" >> "$GITHUB_STEP_SUMMARY"
