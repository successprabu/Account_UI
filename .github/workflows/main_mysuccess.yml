# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - mysuccess

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Install, lint, test and build
        run: |
          npm install --no-audit --no-fund
          npm run lint
          npm test
          npm run build

      - name: Add the latest Android app
        # Built by the AIMobileApp repo on every push to its main branch. Served at /downloads/MySuccess.apk.
        # A missing APK never blocks a website deploy; the download page then links to GitHub instead.
        continue-on-error: true
        run: |
          mkdir -p build/downloads
          curl -fsSL --retry 3 -o build/downloads/MySuccess.apk \
            https://github.com/successprabu/AIMobileApp/releases/latest/download/MySuccess.apk
          ls -lh build/downloads

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          # Only the compiled React app; the App Service serves /home/site/wwwroot with pm2
          path: build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'mysuccess'
          slot-name: 'Production'
          package: .
          # Replace wwwroot completely so no stale files (old builds, node_modules) linger
          clean: true
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_BBD7F36E325A43649785A4DEA8F81DC1 }}